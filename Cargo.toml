[package]
name = "ziban-companion"
version = "0.2.6"
edition = "2024"
license = "Apache-2.0"

[[bin]]
name = "ziban-companion"
path = "crates/companion/src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
windows = { version = "0.61.3", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Accessibility", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Input_Ime", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Storage_FileSystem"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
